<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APSAN, LDA - ERP Contabilístico Robusto</title>
  <!-- Estilos e bibliotecas mantidos para consistência -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    /* ... [Mantém o CSS original anterior] ... */
    :root { --primary: #047857; --audit-bg: #fff7ed; }
    .audit-log { font-size: 10px; color: #64748b; background: var(--audit-bg); padding: 8px; border-radius: 4px; margin-top: 10px; max-height: 80px; overflow-y: auto; }
    .dobrada-warning { color: var(--danger); font-size: 11px; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>

<div class="dashboard-container">
  <header class="master-header">
    <h1><i class="fas fa-landmark"></i> APSAN, LDA - ERP Contabilístico</h1>
  </header>

  <!-- Módulos Estruturados -->
  <div class="master-grid">
    
    <!-- 1. MOTOR CONTABILÍSTICO (Partidas Dobradas & Auditoria) -->
    <div class="grid-module-card">
      <div class="module-header">
        <h4><i class="fas fa-balance-scale"></i> Lançamentos (Partidas Dobradas)</h4>
      </div>
      <div class="module-body">
        <input type="text" id="lc-conta-deb" class="form-control" placeholder="Conta a Debitar">
        <input type="text" id="lc-conta-cred" class="form-control" placeholder="Conta a Creditar">
        <input type="number" id="lc-valor" class="form-control" placeholder="Valor (Kz)">
        <select id="lc-centro" class="form-control">
          <option value="Sede">Centro: Sede</option>
          <option value="Projetos">Centro: Projetos</option>
        </select>
        <button class="btn-primary" onclick="salvarLancamento()">Registar Partida Dobrada</button>
        <div id="audit-trail" class="audit-log"></div>
      </div>
    </div>

    <!-- 2. GESTÃO FISCAL (IVA/IRT) -->
    <div class="grid-module-card blue">
      <div class="module-header"><h4><i class="fas fa-file-invoice"></i> Gestão Fiscal</h4></div>
      <div class="module-body">
        <div id="fiscal-alerts" class="dobrada-warning"></div>
        <table>
          <thead><tr><th>Imposto</th><th>Valor</th><th>Data Vencimento</th></tr></thead>
          <tbody id="tabela-fiscal"></tbody>
        </table>
      </div>
    </div>

    <!-- 3. DEMONSTRAÇÕES (PGC Integrado) -->
    <div class="grid-module-card orange">
      <div class="module-header"><h4><i class="fas fa-chart-line"></i> PGC - Balancete em Tempo Real</h4></div>
      <div class="module-body">
        <table>
          <tr><td>Total Ativo (Classe 1-3)</td><td id="res-ativo">0 Kz</td></tr>
          <tr><td>Total Passivo (Classe 4)</td><td id="res-passivo">0 Kz</td></tr>
          <tr><td>Resultados (Classe 6-7)</td><td id="res-resultado">0 Kz</td></tr>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  // Banco de Dados Estruturado
  let auditLogs = JSON.parse(localStorage.getItem('apsan_audit')) || [];
  
  function salvarLancamento() {
    const deb = document.getElementById('lc-conta-deb').value;
    const cred = document.getElementById('lc-conta-cred').value;
    const val = parseFloat(document.getElementById('lc-valor').value);
    
    if(!deb || !cred || !val) { alert("Dados incompletos."); return; }

    // Registo de Auditoria (Trilha)
    const log = `[${new Date().toLocaleTimeString()}] Débito:${deb} | Crédito:${cred} | Valor:${val} Kz`;
    auditLogs.unshift(log);
    localStorage.setItem('apsan_audit', JSON.stringify(auditLogs));
    
    atualizarUI();
  }

  function atualizarUI() {
    const auditDiv = document.getElementById('audit-trail');
    auditDiv.innerHTML = auditLogs.map(l => `<div>${l}</div>`).join('');
    // Lógica adicional de cálculo para PGC conforme a estrutura proposta
  }

  atualizarUI();
</script>
</body>
</html>
